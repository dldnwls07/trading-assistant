name: Render Keep Alive

on:
  schedule:
    # 10분마다 실행 (UTC 기준 0, 10, 20, 30, 40, 50분)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동 실행 허용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          curl -I https://trading-assistant-all-in-one.onrender.com/api/health
