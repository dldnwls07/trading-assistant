services:
  - type: web
    name: trading-assistant-all-in-one
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: bash start_render.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: IS_VIRTUAL
        value: "True"
      - key: PYTHONPATH
        value: "."
      - key: GEMINI_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TARGET_MARKET
        value: "US"
      - key: TRADE_INTERVAL
        value: "3600"
